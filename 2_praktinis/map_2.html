<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vilniaus miesto pastatų analizė</title>

    <link rel="stylesheet" href="../css/map-only.css">
    <script type="module" src="https://js.arcgis.com/5.0/embeddable-components/"></script>
    <script src="../js/map-only-loader.js" defer></script>
</head>

<body class="map-only-page">
    <div class="map-only-wrapper">
        <div class="map-only-loader" id="mapLoader">
            <div class="map-only-loader-card">
                <div class="map-only-spinner"></div>
                <p class="map-only-loader-text">Žemėlapis kraunasi...</p>
            </div>
        </div>

        <arcgis-embedded-map
            class="map-only-frame"
            id="mapFrame"
            data-loader-delay="1200"
            data-loader-timeout="8000"
            item-id="9c3646f65ed4441b9541f374865702e8"
            theme="light"
            heading-enabled
            legend-enabled
            information-enabled
            scroll-enabled
            time-zone-label-enabled
            center="25.29152177015206,54.68723601005954"
            scale="288895.2771445"
            portal-url="https://www.arcgis.com">
        </arcgis-embedded-map>
    </div>
</body>
</html>
