<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Vilniaus pastatų statybos laikotarpio kaita</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div class="loading">Kraunamas žemėlapis...</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>

  <script>
    fetch('vilniaus_pastatu_statybos_laikotarpio_kaita.html.gz')
      .then(response => {
        if (!response.ok) {
          throw new Error('Nepavyko rasti vilniaus_pastatu_statybos_laikotarpio_kaita.html.gz');
        }
        return response.arrayBuffer();
      })
      .then(buffer => {
        let decompressed = pako.ungzip(new Uint8Array(buffer), { to: 'string' });

        decompressed = decompressed.replace(
          /<title>.*?<\/title>/i,
          '<title>Vilniaus pastatų statybos laikotarpio kaita</title>'
        );

        decompressed = decompressed.replaceAll(
          'Kepler.gl embedded map',
          'Vilniaus pastatų statybos laikotarpio kaita'
        );

        document.open();
        document.write(decompressed);
        document.close();

        document.title = 'Vilniaus pastatų statybos laikotarpio kaita';
      })
      .catch(error => {
        document.body.innerHTML = '<div class="loading">Klaida: ' + error.message + '</div>';
        console.error(error);
      });
  </script>
</body>
</html>
